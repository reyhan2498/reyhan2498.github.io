name: Build and deploy Next.js static export to GitHub Pages docs/

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - run: |
          rm -rf docs
          mkdir docs
          cp -R out/* docs/
          touch docs/.nojekyll
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --quiet --cached || git commit -m 'Build docs output [skip ci]'
          git push origin HEAD:main
